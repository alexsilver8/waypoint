name: Roadmap item
description: Planned work, laid out so a contributor can pick it up
labels: [enhancement, roadmap]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What people will be able to do once this ships, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, or who asked for it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      placeholder: |
        - Ask a question from the search field
        - Keep a history of chats
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Not in scope
      description: What this deliberately leaves for later.
  - type: textarea
    id: where
    attributes:
      label: Where to start
      description: The files, docs or existing code a contributor should read first.
      value: |
        | What | Where |
        | --- | --- |
        |  |  |
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] Works on macOS, Windows and Linux
        - [ ] Described in the README
        - [ ] Covered by unit and end-to-end tests
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - Small (a day)
        - Medium (a few days)
        - Large (a week or more)
  - type: textarea
    id: new-here
    attributes:
      label: New here?
      description: Leave as it is.
      value: |
        Read [CONTRIBUTING.md](https://github.com/alexsilver8/waypoint/blob/main/CONTRIBUTING.md), run `pnpm install && pnpm dev`, and comment here before you start so nobody duplicates work.
