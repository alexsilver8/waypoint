name: release

# Publishes a release when `pnpm release` pushes its tag (v1.2.3): checks everything again, makes a draft GitHub
# release with the notes from CHANGELOG.md, builds the installers on each OS and attaches them, then publishes the
# release. Safe to re-run: an existing release gets its notes updated and its installers replaced.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

      - name: Make the GitHub release (a draft until the installers are attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of the changelog, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $VERSION." > notes.md
          cat >> notes.md <<NOTES

          **Download:** the \`.dmg\` for macOS, the \`.exe\` for Windows, and the \`.AppImage\` or \`.deb\` for Linux, below. Builds aren't code-signed yet, so your system asks once. The Mac build isn't signed with an Apple Developer ID, so on macOS run Waypoint from source with \`pnpm dev\` for now (see the README's Install section). Waypoint installs updates by itself on Windows and from the AppImage, and tells you when there's a new version on macOS and from the \`.deb\`.
          NOTES
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --verify-tag --draft
          fi

  # The installers for each OS, attached to the release.
  build:
    name: build (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm run dist
        env:
          # No signing certificates yet; see README "Install".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # latest*.yml tell installed copies about this version, and the .blockmaps let them download only what changed.
          files=(release/*/*.dmg release/*/*.zip release/*/*.exe release/*/*.AppImage release/*/*.deb release/*/*.blockmap release/*/latest*.yml)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # Out of draft once every installer is attached, so the release never shows without its downloads.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
