# pnpm settings. The repo is a workspace: the app at the root, and in packages/ what's
# published to npm on its own (@waypoint-org/api, the types and helpers for extensions).
packages:
  - packages/*

# Electron downloads its binary on first run, so it needs no install script.
allowBuilds:
  esbuild: true
  # Ships prebuilt binaries, so its install script (which would compile one) isn't needed.
  uiohook-napi: false
  electron-winstaller: false

# Keep every Tiptap package on the same release: @tiptap/react's optional menus would
# otherwise float to a newer one than the core they plug into.
overrides:
  "@tiptap/extension-bubble-menu": 3.31.3
  "@tiptap/extension-floating-menu": 3.31.3
