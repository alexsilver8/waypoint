# Packaging config: https://www.electron.build/configuration
appId: dev.waypoint.app
productName: Waypoint
copyright: Copyright © 2026 Alexander Silver and contributors
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
# The extensions that come with the app load from its resources, like any other extension.
extraResources:
  - from: extensions
    to: extensions
    filter:
      - '**/*'
      - '!**/*.test.*'
# waypoint://notes/<id> opens a note (Copy Deeplink in the Notes window), and
# waypoint://commands/<extension>/<command> runs a command.
protocols:
  - name: Waypoint
    schemes: [waypoint]
# Where the app looks for new versions (src/main/updater.ts). The build writes it into the app, and
# the latest*.yml files it makes next to the installers say what the newest version is; the release
# workflow attaches both to the GitHub release.
publish:
  provider: github
  owner: alexsilver8
  repo: waypoint
  releaseType: release

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  extendInfo:
    # A launcher lives in the menu bar, not the Dock.
    LSUIElement: true

win:
  target: [nsis]
  artifactName: ${name}-${version}-win-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false

linux:
  target: [AppImage, deb]
  category: Utility
  maintainer: Alexander Silver
  artifactName: ${name}-${version}-linux-${arch}.${ext}
